[project]
name = "career-pipeline"
version = "0.1.0"
description = "Builds static statistics JSON for career-map"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["career_pipeline"]
